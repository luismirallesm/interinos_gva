name: scrape

on:
  push:
    paths: ["inbox/**"]       # al subir un PDF a inbox/ se procesa solo
  schedule:
    - cron: "0 7,15 * * 2-5"  # mar-vie (listados martes y jueves + respaldo)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m scraper.build
      - name: Commit datos si hay cambios
        run: |
          git config user.name "interinos-bot"
          git config user.email "interinos-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "data: actualización $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
