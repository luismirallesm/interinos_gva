<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bolsa de maestros GVA · consulta no oficial</title>
<style>
:root{--bg:#f6f7f9;--ink:#172033;--mut:#5b6678;--line:#d9dee6;--card:#fff;--acc:#0f6b6b;--warn:#9a5b00;--ok:#1d6b3a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1520;--ink:#e8ecf3;--mut:#9aa6b8;--line:#263146;--card:#161e2d;--acc:#4fb3b3;--warn:#e0a84a;--ok:#5fcf8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 1.5rem/1.2 Georgia,serif;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:inherit;padding:8px 14px;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc);font-weight:600}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.row>*{flex:1 1 180px}
.hint,.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.name{font-weight:600}
.big{font:600 2.4rem/1 Georgia,serif;color:var(--acc)}
.big small{font:400 .85rem system-ui;color:var(--mut);display:block;margin-top:4px}
.tag{display:inline-block;font-size:.8rem;border:1px solid currentColor;border-radius:4px;padding:0 6px;margin-top:4px}
.t-adjudicado{color:var(--ok)}.t-desactivado{color:var(--mut)}.t-no_adjudicado,.t-ha_participado,.t-no_ha_participado{color:var(--warn)}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px;margin:16px 6px 8px}
.bar i{position:absolute;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:3px solid var(--acc);background:var(--card)}
.bar i.now{background:var(--acc)}
.cmp{margin:6px 0 0;font-size:.92rem}
.warn{color:var(--warn);font-size:.9rem;margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.bars div{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.9rem}
.bars b{display:block;height:14px;background:var(--acc);border-radius:2px;min-width:2px}
.kpi{display:flex;gap:12px;flex-wrap:wrap}.kpi .card{flex:1 1 200px}
footer{margin-top:28px;color:var(--mut);font-size:.82rem}
[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1>Bolsa de maestros · Comunitat Valenciana</h1>
<p class="sub" id="estado">Cargando datos…</p>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-t="buscar">Mi posición</button>
  <button role="tab" aria-selected="false" data-t="adj">Adjudicaciones</button>
  <button role="tab" aria-selected="false" data-t="met">Métricas</button>
</nav>

<section id="buscar">
  <label for="q" class="hint">Apellidos y nombre (o parte), o número de orden</label>
  <input id="q" type="search" placeholder="Ej.: garcia lopez ana" autocomplete="off">
  <p class="hint">Los listados de la GVA no incluyen NIF: la búsqueda es por nombre. Si hay homónimos verás todos.</p>
  <div id="res"></div>
</section>

<section id="adj" hidden>
  <div class="row">
    <input id="fq" type="search" placeholder="Nombre o centro">
    <select id="fp"><option value="">Todas las provincias</option></select>
    <select id="fe"><option value="">Todas las especialidades</option></select>
  </div>
  <p class="mut" id="fcount"></p>
  <div class="scroll"><table><thead><tr><th>Nombre</th><th>Orden</th><th>Centro</th><th>Especialidad</th><th>Jornada</th></tr></thead><tbody id="ft"></tbody></table></div>
</section>

<section id="met" hidden></section>

<footer>
